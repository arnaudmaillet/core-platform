# .github/workflows/fleet-images-deploy.yml
#
# Build + push every fleet binary (21 services/workers + migrator +
# topic-provisioner) to ECR — one image per binary, one multi-arch manifest per
# binary. Add a binary to FLEET_BINS below to ship a new one (see its comment).
#
# ── Shape: ONE build job per architecture, not one per (binary, arch) ─────────
# The 23 binaries share almost the whole dependency graph AND the workspace
# crates (foundation / platform / storage / service). Compiling them in one
# `cargo build` per arch compiles that shared graph ONCE instead of 23 times,
# and keeps the run under GitHub's 20-concurrent-job cap (the previous 44-job
# matrix ran in three waves). Compiled artifacts are cached runner-side with
# Swatinem/rust-cache (GitHub Actions cache, free on this public repo), so a
# push only recompiles the crates it touched and their dependents.
#
# Images are produced WITHOUT compiling inside Docker: deploy/docker-bake.hcl
# builds only the Dockerfile's `runtime` stage for each binary, overriding the
# `builder` stage with a local dir holding the prebuilt binary (a BuildKit named
# context). The Dockerfile's own cargo-chef route is unchanged and stays the
# local / docker-compose path (`docker build --build-arg BIN=…`).
#
# Why no registry-side build cache: the previous per-(bin,arch) BuildKit cache
# on ECR cost 83.55 USD of DataTransfer-Out in July 2026 (1,028 GB — ~40 GB and
# ~4 USD per push to develop), and even moved to GHCR (#638) it could only cache
# third-party crates. This layout needs no registry cache at all: ECR only ever
# receives image pushes (ingress is free).
#
# Auth + region come from the same repo secrets the other deploy workflows use
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION).
#
# Each image is tagged with the immutable :<git-sha> (the deployment handle) and a
# floating :staging (convenience only). After BOTH arches succeed, the
# `pin-staging-images` job rewrites the staging overlay's fleet image tags to that
# :<git-sha> and commits back to develop — so ArgoCD sees a real manifest diff and
# rolls out, deploys are content-addressed (IfNotPresent is correct for an
# immutable tag), and a rollback is just `git revert`.
name: Build & Push Fleet Images

on:
  push:
    branches: [develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deploy/Dockerfile'
      - 'deploy/docker-bake.hcl'
      - '.github/workflows/fleet-images-deploy.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (default: staging)'
        default: staging

permissions:
  contents: read

env:
  # THE list of fleet binaries this workflow ships. Package name == binary name
  # == crates/apps/<name> == ECR repo core-platform-<name>. Consumed by the cargo
  # build, the bake matrix, the stitch loop and the staging pin — one source.
  # Adding a binary: add it here, to infrastructure/live/global/artifacts/ecr
  # (and APPLY it before merging — ECR does not auto-create repos, the push would
  # fail), and to the overlays' `images:` so the pin job can rewrite its tag.
  FLEET_BINS: >-
    counter-server counter-worker audit-server audit-worker
    auth-server media-server media-worker moderation-server search-server
    realtime-gateway realtime-dispatcher
    account-server chat-server comment-server engagement-server
    geo-discovery-server notification-server post-server profile-server
    social-graph-server timeline-server
    migrator topic-provisioner

jobs:
  build-and-push:
    name: Build fleet (${{ matrix.arch.suffix }})
    # Native runner per arch — no QEMU: emulated rustc on this workspace is
    # hours territory, while ubuntu-24.04-arm is free on public repos and
    # compiles at full speed. Each arch pushes arch-suffixed tags; the stitch
    # job below merges them into one multi-arch manifest per binary.
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest,     suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm,  suffix: arm64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same system deps as deploy/Dockerfile's builder stage and ci.yml: protoc
      # + the well-known types for the *-api build.rs (tonic-prost-build), cmake
      # + zlib for the bundled librdkafka.
      - name: Build deps (protoc, librdkafka toolchain)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev cmake zlib1g-dev

      # rust-toolchain.toml pins the workspace toolchain (1.96.0); the rustup
      # shim honors it at cargo-invocation time, exactly as in ci.yml.
      - uses: dtolnay/rust-toolchain@stable

      # Runner-side compile cache (GitHub Actions cache). One key per arch —
      # artifacts are not portable across targets. cache-workspace-crates keeps
      # OUR crates' artifacts too (not only third-party), so a push recompiles
      # just the crates it touched and their dependents. Saved only from develop
      # so a manual dispatch on a branch cannot poison it. Budget: the repo cache
      # cap is 10 GB shared with ci.yml — watch `gh cache list`; if the two
      # release caches crowd it out, flip cache-workspace-crates to false
      # (deps-only, the cargo-chef `cook` equivalent).
      - uses: Swatinem/rust-cache@v2
        with:
          key: fleet-release-${{ matrix.arch.suffix }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Build every fleet binary (release)
        env:
          # Well-known .proto types live in /usr/include (libprotobuf-dev).
          PROTOC_INCLUDE: /usr/include
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          cargo build --release --locked $(printf -- '-p %s ' $FLEET_BINS)

      # One named-context dir per binary, laid out as the Dockerfile's builder
      # stage would have left it (/usr/local/bin/app) so `COPY --from=builder`
      # resolves unchanged. Only the binaries reach BuildKit — never target/.
      - name: Stage binaries for packaging
        run: |
          set -euo pipefail
          for bin in $FLEET_BINS; do
            install -D -m 0755 "target/release/$bin" "dist/$bin/usr/local/bin/app"
          done
          du -sh dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # All fleet images in ONE BuildKit session (see deploy/docker-bake.hcl):
      # the shared runtime layers are built once; each image is a COPY of its
      # binary, then pushed as :<sha>-<arch>.
      - name: Package and push images (${{ matrix.arch.suffix }})
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch.suffix }}
          PLATFORM: ${{ matrix.arch.platform }}
        run: docker buildx bake -f deploy/docker-bake.hcl --push

  # ── Stitch per-arch images into one multi-arch manifest per binary ───────────
  # The :<git-sha> and floating tags only exist once BOTH arch builds succeeded
  # (needs: gates on the full matrix) — a half-arch fleet is never addressable
  # by the tags the overlays and the promote workflow use. This is what lets
  # the Karpenter pools re-allow arm64: kubelet resolves the right arch from
  # the manifest list.
  stitch-manifests:
    name: Create multi-arch manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Stitch and verify every binary
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.inputs.tag || 'staging' }}
        run: |
          set -euo pipefail
          # imagetools has failed twice with a bare exit-255 immediately AFTER a
          # successful manifest push (runs 28727067443, 28728911748) — transient
          # registry/transport flake, both times fixed by a plain rerun. Bounded
          # retries beat re-running the whole workflow to re-execute one command.
          retry() {
            local attempt=1
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 3 ]; then
                echo "FAILED after 3 attempts: $*" >&2
                return 1
              fi
              echo "attempt $attempt/3 after transient failure: $*" >&2
              sleep 10
            done
          }
          for bin in $FLEET_BINS; do
            retry docker buildx imagetools create \
              -t "$REG/core-platform-$bin:${{ github.sha }}" \
              -t "$REG/core-platform-$bin:$TAG" \
              "$REG/core-platform-$bin:${{ github.sha }}-amd64" \
              "$REG/core-platform-$bin:${{ github.sha }}-arm64"
            # Fail loudly if the stitched manifest is missing either platform.
            retry sh -c "docker buildx imagetools inspect '$REG/core-platform-$bin:${{ github.sha }}' | grep -q 'linux/amd64'"
            retry sh -c "docker buildx imagetools inspect '$REG/core-platform-$bin:${{ github.sha }}' | grep -q 'linux/arm64'"
            echo "stitched: $bin"
          done

  # ── Pin the staging overlay to the immutable tag we just built ────────────────
  # Runs once after BOTH arch builds + the stitch succeed; if anything fails, the
  # fleet is not pinned (a partial rollout is never promoted). Rewrites ONLY the
  # images this workflow builds, then commits back to develop so ArgoCD rolls
  # out the new revision.
  pin-staging-images:
    name: Pin staging overlay to immutable tags
    needs: stitch-manifests
    runs-on: ubuntu-latest
    # Only auto-pin for the standard staging build (skip manual one-off tags).
    if: ${{ github.event_name == 'push' || (github.event.inputs.tag || 'staging') == 'staging' }}
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # Push over SSH with the repo deploy key: develop's ruleset requires
          # PRs but grants DeployKey bypass, so this job (and only a holder of
          # this key) may land the sha-pin commit directly. The default
          # GITHUB_TOKEN push is rejected by the ruleset — GitHub can't grant
          # the Actions app a ruleset bypass on user-owned repos.
          ssh-key: ${{ secrets.FLEET_PIN_DEPLOY_KEY }}

      - name: Pin fleet images to the built commit SHA
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for bin in $FLEET_BINS; do
            NAME="core-platform-$bin" NEWTAG="$TAG" \
              yq -i '(.images[] | select(.name == strenv(NAME)).newTag) = strenv(NEWTAG)' \
              k8s/overlays/staging/kustomization.yaml
          done

      - name: Commit & push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- k8s/overlays/staging/kustomization.yaml; then
            echo "Fleet images already pinned to ${TAG}; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "chore(deploy): pin staging fleet images to ${TAG} [skip ci]"
          # Rebase in case develop advanced while the fleet was building.
          git pull --rebase origin develop
          git push origin develop
