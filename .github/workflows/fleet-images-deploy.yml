# .github/workflows/fleet-images-deploy.yml
#
# Build + push every fleet binary (20 services + the shared migrator) to ECR,
# one image per binary via the generic deploy/Dockerfile (`--build-arg BIN`).
# Add a BIN to the matrix to ship a new one.
#
# Auth + region come from the same repo secrets the existing deploy workflows use
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION). Each binary is built in
# parallel, reusing a shared BuildKit registry cache of the cargo-chef cook layer
# (librdkafka, tonic, scylla, sqlx…) so a source edit only rebuilds the workspace+
# build layer.
#
# ── Why the cache lives on GHCR, keyed per-ARCH ────────────────────────────────
# It used to be an ECR ref keyed per (BIN, ARCH). Both halves of that were wrong
# and cost real money — July 2026 billed 83.55 USD for 1,028 GB of ECR
# DataTransfer-Out, the single largest line on the account:
#
#   1. WRONG REGISTRY. The runners are on GitHub, so every cache pull/push
#      crossed the AWS egress boundary at ~0.09 USD/GB. 44 jobs × a multi-GB
#      mode=max Rust cache ≈ 8–15 USD *per push to develop*. GHCR sits on the
#      same network as the runners: that traffic is free.
#   2. WRONG KEY. `cargo chef cook` runs BEFORE `ARG BIN` in deploy/Dockerfile,
#      so the cooked layer is byte-identical for all 22 binaries — the per-BIN
#      key stored 22 redundant copies of it per arch. And the per-BIN *build*
#      layer it seemed to protect is worthless anyway: `COPY . .` sits above
#      `cargo build -p $BIN`, so any source edit busts it for every binary.
#      Only the cook layer is cacheable across a push, and it is arch-scoped.
#      44 refs → 2.
#
# Aggravating factor now removed: all 44 tags lived in ONE ECR repo, and the ECR
# module applies `imageCountMoreThan: 30 → expire` to every repo — so 14 cache
# entries were permanently expiring in rotation. We paid egress for a cache that
# could not, by construction, ever be complete. The buildcache repo is dropped
# from the ECR repo list in the same change.
#
# Only ONE job per arch writes the cache (CACHE_WRITER_BIN) — otherwise 22
# concurrent jobs would each upload the full mode=max export to the same ref,
# last-writer-wins, for no benefit. Every job reads it. If the writer job fails,
# the previous cache stays readable: the next run is warm-but-stale, never cold.
#
# Each image is tagged with the immutable :<git-sha> (the deployment handle) and a
# floating :staging (convenience only). After the matrix succeeds, the
# `pin-staging-images` job rewrites the staging overlay's fleet image tags to that
# :<git-sha> and commits back to develop — so ArgoCD sees a real manifest diff and
# rolls out, deploys are content-addressed (IfNotPresent is correct for an
# immutable tag), and a rollback is just `git revert`. Previously the overlay
# pinned a MUTABLE :staging tag, so new builds never landed on reschedule and there
# was no record of what was running.
name: Build & Push Fleet Images

on:
  push:
    branches: [develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/Dockerfile'
      - '.github/workflows/fleet-images-deploy.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (default: staging)'
        default: staging

permissions:
  contents: read

jobs:
  build-and-push:
    # Native runner per arch — no QEMU: emulated rustc on a 22-binary workspace
    # is hours-per-binary territory, while ubuntu-24.04-arm is free on public
    # repos and compiles at full speed. Each (bin, arch) pushes an arch-suffixed
    # tag; the stitch job below merges them into one multi-arch manifest.
    runs-on: ${{ matrix.arch.runner }}
    # packages: write — push/pull the BuildKit cook cache on GHCR with GITHUB_TOKEN.
    # Job-level `permissions` replaces the workflow default wholesale, so
    # contents: read is restated here.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest,     suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm,  suffix: arm64 }
        bin:
          - counter-server
          - counter-worker
          - audit-server
          - audit-worker
          - auth-server
          - media-server
          - moderation-server
          - search-server
          - realtime-gateway
          - realtime-dispatcher
          # ── Core services (same Rust workspace; the staging overlay deploys these too) ──
          - account-server
          - chat-server
          - comment-server
          - engagement-server
          - geo-discovery-server
          - notification-server
          - post-server
          - profile-server
          - social-graph-server
          - timeline-server
          # ── Shared ──
          - migrator
          - topic-provisioner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Cache registry. Images stay on ECR (the overlays and Karpenter pull from
      # there); only the BuildKit cache moves to GHCR, where egress to these
      # runners is free. GITHUB_TOKEN is enough — no new secret.
      - name: Login to GHCR (BuildKit cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.bin }} (${{ matrix.arch.suffix }})
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          BIN: ${{ matrix.bin }}
          ARCH: ${{ matrix.arch.suffix }}
          PLATFORM: ${{ matrix.arch.platform }}
          # Arch-scoped, NOT bin-scoped: the cook layer is identical across all
          # 22 binaries (see the header). Lowercased — GHCR rejects uppercase
          # path segments, and github.repository_owner preserves the account's case.
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/core-platform-buildcache
          # The single designated cache writer for this arch. Any binary produces
          # the same cook layer, so the choice is arbitrary and stable.
          CACHE_WRITER_BIN: migrator
        run: |
          set -euo pipefail
          ref="$(echo "$CACHE_REF" | tr '[:upper:]' '[:lower:]'):cook-$ARCH"

          # Every job reads the shared cook cache; exactly one writes it back.
          #   image-manifest+oci-mediatypes: GHCR stores the cache as a normal OCI
          #     manifest. Without them BuildKit exports its own cache-manifest
          #     media type, which GHCR rejects.
          #   ignore-error: the cache is an optimization, never a deliverable — a
          #     failed export must not fail a fleet image build.
          cache_to=""
          if [ "$BIN" = "$CACHE_WRITER_BIN" ]; then
            cache_to="--cache-to=type=registry,ref=$ref,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            echo "::notice::$BIN is the cook-cache writer for $ARCH ($ref)"
          fi

          docker buildx build \
            -f deploy/Dockerfile \
            --platform "$PLATFORM" \
            --build-arg BIN="$BIN" \
            --cache-from="type=registry,ref=$ref" \
            $cache_to \
            -t "$REG/core-platform-$BIN:${{ github.sha }}-$ARCH" \
            --push .

  # ── Stitch per-arch images into one multi-arch manifest per binary ───────────
  # The :<git-sha> and floating tags only exist once BOTH arch builds succeeded
  # (needs: gates on the full matrix) — a half-arch fleet is never addressable
  # by the tags the overlays and the promote workflow use. This is what lets
  # the Karpenter pools re-allow arm64: kubelet resolves the right arch from
  # the manifest list.
  stitch-manifests:
    name: Create multi-arch manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Stitch and verify every binary
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.inputs.tag || 'staging' }}
        run: |
          set -euo pipefail
          # imagetools has failed twice with a bare exit-255 immediately AFTER a
          # successful manifest push (runs 28727067443, 28728911748) — transient
          # registry/transport flake, both times fixed by a plain rerun. Bounded
          # retries beat re-running a 44-job workflow to re-execute one command.
          retry() {
            local attempt=1
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 3 ]; then
                echo "FAILED after 3 attempts: $*" >&2
                return 1
              fi
              echo "attempt $attempt/3 after transient failure: $*" >&2
              sleep 10
            done
          }
          # Keep in sync with the build matrix above.
          for bin in \
            counter-server counter-worker audit-server audit-worker \
            auth-server media-server moderation-server search-server \
            realtime-gateway realtime-dispatcher \
            account-server chat-server comment-server engagement-server \
            geo-discovery-server notification-server post-server profile-server \
            social-graph-server timeline-server \
            migrator topic-provisioner; do
            retry docker buildx imagetools create \
              -t "$REG/core-platform-$bin:${{ github.sha }}" \
              -t "$REG/core-platform-$bin:$TAG" \
              "$REG/core-platform-$bin:${{ github.sha }}-amd64" \
              "$REG/core-platform-$bin:${{ github.sha }}-arm64"
            # Fail loudly if the stitched manifest is missing either platform.
            retry sh -c "docker buildx imagetools inspect '$REG/core-platform-$bin:${{ github.sha }}' | grep -q 'linux/amd64'"
            retry sh -c "docker buildx imagetools inspect '$REG/core-platform-$bin:${{ github.sha }}' | grep -q 'linux/arm64'"
            echo "stitched: $bin"
          done

  # ── Pin the staging overlay to the immutable tag we just built ────────────────
  # Runs once after ALL matrix builds succeed; if any binary fails, the fleet is
  # not pinned (a partial rollout is never promoted). Rewrites ONLY the images this
  # workflow builds, then commits back to develop so ArgoCD rolls out the new
  # revision.
  pin-staging-images:
    name: Pin staging overlay to immutable tags
    needs: stitch-manifests
    runs-on: ubuntu-latest
    # Only auto-pin for the standard staging build (skip manual one-off tags).
    if: ${{ github.event_name == 'push' || (github.event.inputs.tag || 'staging') == 'staging' }}
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # Push over SSH with the repo deploy key: develop's ruleset requires
          # PRs but grants DeployKey bypass, so this job (and only a holder of
          # this key) may land the sha-pin commit directly. The default
          # GITHUB_TOKEN push is rejected by the ruleset — GitHub can't grant
          # the Actions app a ruleset bypass on user-owned repos.
          ssh-key: ${{ secrets.FLEET_PIN_DEPLOY_KEY }}

      - name: Pin fleet images to the built commit SHA
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Keep in sync with the build matrix above (the images this workflow ships).
          for bin in \
            counter-server counter-worker audit-server audit-worker \
            auth-server media-server moderation-server search-server \
            realtime-gateway realtime-dispatcher \
            account-server chat-server comment-server engagement-server \
            geo-discovery-server notification-server post-server profile-server \
            social-graph-server timeline-server \
            migrator topic-provisioner; do
            NAME="core-platform-$bin" NEWTAG="$TAG" \
              yq -i '(.images[] | select(.name == strenv(NAME)).newTag) = strenv(NEWTAG)' \
              k8s/overlays/staging/kustomization.yaml
          done

      - name: Commit & push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- k8s/overlays/staging/kustomization.yaml; then
            echo "Fleet images already pinned to ${TAG}; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "chore(deploy): pin staging fleet images to ${TAG} [skip ci]"
          # Rebase in case develop advanced while the matrix was building.
          git pull --rebase origin develop
          git push origin develop
